name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      # Before the provider checkout below, which has .tf examples of its own.
      - run: terraform fmt -check -recursive
      # Until the provider is on the Registry, build it from its repo and point Terraform at the binary.
      - uses: actions/checkout@v4
        with:
          repository: uplapse/terraform-provider-uplapse
          path: .provider
      - uses: actions/setup-go@v5
        with:
          go-version-file: .provider/go.mod
          cache-dependency-path: .provider/go.sum
      - name: Build the provider
        run: |
          (cd .provider && go build -o "$RUNNER_TEMP/tfbin/terraform-provider-uplapse" .)
          printf 'provider_installation {\n  dev_overrides { "uplapse/uplapse" = "%s" }\n  direct {}\n}\n' "$RUNNER_TEMP/tfbin" > "$RUNNER_TEMP/dev.tfrc"
      - run: terraform validate -no-color
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/dev.tfrc
      - run: terraform test -no-color
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/dev.tfrc
      - run: tests/integration.sh
        env:
          PROVIDER_DIR: .provider
